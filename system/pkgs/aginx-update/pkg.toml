# aginx-update — 自更新器的包形态（刀F，2026-09-12：出镜像走包）。
# 母体包 depends 锚住（装 aginx 自动带）。
# 系统升级=aginx-update apply（A/B；无 rootfs 则 /home 原位）。
# L0/fastboot 刷 userdata=出厂重装，禁止当升级。裸箱无 apply 面才走 flash。
# BOOT_OK_BIN=/usr/bin/aginx-boot-ok 与
# DOWNLOAD_BIN=/usr/bin/aginx-download 都是 L0 直装件——包体零改。
# hwd 消费者：device.toml 加键=重打本包。
# 2026-10-31：check/idle/auto + 空闲自动升（cron 03:37，错开 night/晨报/backup）。
name = "aginx-update"
version = "0.1.3"
summary = "A/B 自更新：status/apply/check/idle/auto（空闲才自动升；face /var/bin/aginx-update）"
group = "sys"
url = "https://pkgs.aginx.net/aginx-update/v0.1.3/aginx-update-v0.1.3-4pc.tar"

exec = "bin/aginx-update"

[cron]
lines = [
  "37 3 * * * /var/bin/aginx-update auto >> /var/log/aginx-auto-update.log 2>&1",
]
